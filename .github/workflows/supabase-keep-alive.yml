name: Supabase Keep Alive

on:
  schedule:
    # Runs automatically every 4 hours
    - cron: "0 */4 * * *"

  # Allows manual testing
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase Database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

        run: |
          set -e

          echo "================================"
          echo "Supabase Keep Alive Started"
          echo "Time: $(date -u)"
          echo "================================"

          RESPONSE=$(curl \
            --silent \
            --show-error \
            --fail-with-body \
            --request PATCH \
            "${SUPABASE_URL}/rest/v1/keep_alive?id=eq.1&select=id,last_ping" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            --data '{"last_ping":"now()"}')

          echo "Supabase Response:"
          echo "$RESPONSE"

          echo "================================"
          echo "Supabase Database Ping Successful"
          echo "================================"
