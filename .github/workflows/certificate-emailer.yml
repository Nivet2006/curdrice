name: Certificate Emailer

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Database Job ID (email_jobs.id)'
        required: true
        type: string
      live_run:
        description: 'Send live emails (Uncheck for Dry Run)'
        required: true
        type: boolean
        default: false
      delay:
        description: 'Delay between emails in seconds'
        required: false
        type: string
        default: '0.5'

jobs:
  run-certificate-mailer:
    name: Execute Certificate Mailer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests supabase

      - name: Run Certificate Mailer Script
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          CMD="python send_certificates.py --job-id ${{ github.event.inputs.job_id }} --delay ${{ github.event.inputs.delay }}"
          if [ "${{ github.event.inputs.live_run }}" = "true" ]; then
            CMD="$CMD --send"
          fi
          echo "Executing command: $CMD"
          $CMD
